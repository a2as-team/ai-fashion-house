    params:
      caller: [save_generated_image]
      path: [output_folder]
  media_files_local_path:
    type: literal
    actions: [read, write]
    params:
      caller: [Path(OUTPUT_FOLDER), media_files_local_path.mkdir]
  moodboard.png:
    type: literal
    actions: [read]
    params:
      caller: [retrieve_met_images]
      path: [output_folder]
  open-source/ai-fashion-house/outputs/generated_image_1.png:
    type: variable
    actions: [read]
    params:
      caller: [aiofiles.open, os.path.basename]
  output_file:
