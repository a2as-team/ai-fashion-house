manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: margaretmz/ai-fashion-house
    source: https://github.com/margaretmz/ai-fashion-house
    branch: main
    commit: "3550dba7"
    scope: [main.py, src/ai_fashion_house/agents/fashion_design_agent/agent.py, src/ai_fashion_house/agents/marketing_agent/agent.py,
      src/ai_fashion_house/agents/marketing_agent/imagen.py, src/ai_fashion_house/agents/marketing_agent/veo.py, src/ai_fashion_house/agents/met_rag_agent/agent.py,
      src/ai_fashion_house/agents/met_rag_agent/tools.py, src/ai_fashion_house/agents/search_agent/agent.py, src/ai_fashion_house/web/api.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:37:54Z'
    url: https://a2as.org/certified/agents/margaretmz/ai-fashion-house
  signatures:
    digest: sha256:IotECI-xxYOMm4s4WUu_3zdU3sIKBdiHXK-_fRvvY8M
    key: ed25519:wyx2047QouurT965EpAt56fSARxq2gruVLI9QJ1KjzM
    sig: ed25519:3JYgt_FsFNcaBnBfYVWdjcWuOmHZOFSlcOCUNsqRG9L-RH2EwuiVzQYi6uGwy0Y6ploM45-WyJrZXjpCHxuyCQ

agents:
  prompt_writer_agent:
    type: instance
    models: [gemini-2.0-flash]
    tools: [get_fashion_model_details]
    params:
      name: prompt_writer_agent
      description: Transforms visual references and historical context into a vivid, fashion-forward prompt for AI media generation.
      instruction: get_instructions()
      output_key: enhanced_prompt
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.5"
  research_agent:
    type: instance
    params:
      name: research_agent
      description: Coordinates the execution of the met_rag_agent and search agent agents to gather fashion inspiration and
        insights.
      sub_agents: [met_rag_agent, search_agent]
  root_agent.0:
    type: instance
    models: [gemini-2.0-flash]
    tools: [fashion_design_agent_tool, generate_image, generate_video, load_artifacts]
    params:
      name: marketing_agent
      instruction: get_instructions()
      description: Coordinates the fashion creative process by running style agent and generating fashion media.
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.5"
      output_key: social_media_post
      instance: root_agent
  root_agent.1:
    type: instance
    params:
      name: fashion_design_agent
      description: Coordinates the fashion inspiration gathering process and prompt writing for AI media generation.
      instance: root_agent
      sub_agents: [research_agent, prompt_writer_agent]
  root_agent.2:
    type: instance
    models: [gemini-2.0-flash-001]
    tools: [google_search]
    params:
      name: search_agent
      description: Search the web for visual inspiration related to the user's fashion concept.
      instruction: get_instructions()
      output_key: search_results
      instance: root_agent
  root_agent.3:
    type: instance
    models: [gemini-2.0-flash-001]
    tools: [retrieve_met_images]
    params:
      name: met_rag_agent
      description: Search The Met's public collection for historical fashion images and artifacts.
      instruction: get_instructions()
      output_key: met_rag_results
      instance: root_agent

models:
  gemini-2.0-flash:
    type: literal
    agents: [root_agent.0, prompt_writer_agent]
  gemini-2.0-flash-001:
    type: literal
    agents: [root_agent.2, root_agent.3]

tools:
  fashion_design_agent_tool:
    type: function
    agents: [root_agent.0]
  generate_image:
    type: function
    agents: [root_agent.0]
    params:
      description: |-
        Generate an image using a text prompt. Optionally save the result via a ToolContext.

        Args:
            enhanced_prompt (str): A descriptive text prompt for image generation.
            tool_context (Optional[ToolContext]): Optional context to save the artifact remotely.

        Returns:
            dict[str, str]: A dictionary containing the status and message of the operation.
  generate_video:
    type: function
    agents: [root_agent.0]
    params:
      description: |-
        Main entry point to generate a fashion-themed video from a single input image.

        This function supports loading from a ToolContext or directly from local disk,
        uploading the image to GCS, and using Gemini to generate video content with a fallback
        to dynamic prompt generation if the initial request fails.

        Args:
            image_gcs_uri (str): The GCS URI of the input image to use for video generation.
            tool_context (Optional[ToolContext]): Optional context for loading artifacts.

        Returns:
            dict[str, Any]: A dictionary containing the result status and message.
  get_fashion_model_details:
    type: function
    agents: [prompt_writer_agent]
  google_search:
    type: module
    agents: [root_agent.2]
  load_artifacts:
    type: module
    agents: [root_agent.0]
  retrieve_met_images:
    type: function
    agents: [root_agent.3]
    params:
      description: |-
        Orchestrates the full RAG pipeline: refines the user query, retrieves similar embeddings,
        and returns a list of matching GCS image URLs.

        Also generates a moodboard of the top results.

        Args:
            user_query (str): Initial query string describing the desired fashion style.
            top_k (int, optional): Number of top image results to return. Defaults to 6.
            search_fraction (float, optional): Search scope for approximate vector match. Defaults to 0.01.
            tool_context (ToolContext, optional): Context for tool execution, if needed.

        Returns:
            Optional[List[str]]: A list of GCS URLs to matching images, or None if no matches found.

teams:
  research_agent:
    type: parallel
    agents: [research_agent, met_rag_agent, search_agent]
  root_agent.1:
    type: sequential
    agents: [root_agent.1, research_agent, prompt_writer_agent]

